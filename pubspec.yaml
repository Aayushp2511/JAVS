name: secure_messenger
description: "A secure messaging application - JAVS.CORE"
publish_to: 'none'

version: 1.0.0+1

# This section is what the terminal was asking for:
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons, and Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  lottie: ^3.3.3
  glass_kit: ^4.0.2
  flutter_animate: ^4.5.2
  
  # State Management
  flutter_riverpod: ^3.3.1

  # Firebase Core & Services
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  # Storage & Security
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  crypto: ^3.0.6

  # Navigation & Routing
  go_router: ^17.2.0

  # Utilities (ffi set to a stable 2.x version)
  intl: ^0.20.2
  ffi: ^2.1.2
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Ensure you have an 'assets' folder in your project if you uncomment these:
  # assets:
  #   - assets/animations/
  #   - assets/images/